name: flutter_application_1
description: "MusicS - Ultra Customizable Music Player"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2

  # Audio
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.17
  on_audio_query: ^2.9.0
  audio_video_progress_bar: ^2.0.3

  # State Management
  flutter_riverpod: ^2.6.1

  # Local Database
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Storage & Files
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  permission_handler: ^11.3.1

  # Localization
  easy_localization: ^3.0.7

  # Utilities
  palette_generator: ^0.3.3+4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/l10n/
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "lib/logo/logo.png"
  min_sdk_android: 24
